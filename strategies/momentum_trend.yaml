# 动量趋势策略
name: momentum_trend
display_name: 动量趋势策略
description: 捕捉强势股的上涨动量，在回调时寻找买入机会
category: trend
core_rules: [1, 2]
required_tools:
  - get_daily_history
  - analyze_trend
  - get_money_flow
aliases: [动量, 强势股, 趋势跟踪]
default_active: true
default_priority: 10
market_regimes: [trending_up, bullish]

instructions: |
  **动量趋势策略 (Momentum Trend Strategy)**

  适用场景：
  - 寻找强势上涨股票，在回调时低吸
  - 捕捉市场热点和龙头股机会

  分析框架：

  1. **动量确认**
     - 使用 `get_daily_history` 检查近期涨幅
     - 20日内涨幅超过15%视为强势动量
     - 价格站上 MA5、MA10、MA20 均线
     - MA 斜率向上，多头排列

  2. **资金流向验证**
     - 使用 `get_money_flow` 检查主力资金
     - 主力资金连续3日净流入为佳
     - 超大单净流入占比 > 20% 为强信号

  3. **买入时机**
     - 缩量回调至 MA5/MA10 附近
     - 回调幅度不超过涨幅的 38.2%（黄金分割）
     - 成交量萎缩至近期均量的 50%-70%
     - 出现下影线探底回升信号

  4. **风险控制**
     - 止损位：MA20 下方 3% 或前期低点
     - 止盈位：
       * 短期：+8-12% 部分减仓
       * 中期：+20-30% 全部止盈
     - 跌破 MA20 且无反弹，果断止损

  5. **卖出信号**
     - 放量滞涨（成交量大但价格不涨）
     - 高位横盘超过5日
     - 主力资金连续大幅净流出
     - 跌破关键支撑位

  评分调整建议：
  - 动量强劲（涨幅>20%，多头排列）：+15
  - 主力资金大幅净流入：+12
  - 缩量回调至支撑位：+10
  - 放量滞涨或资金流出：-15
  - 跌破 MA20：-20
